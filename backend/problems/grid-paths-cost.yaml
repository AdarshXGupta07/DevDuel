slug: grid-paths-cost
title: Cheapest Route Through The Yard
difficulty: medium
tags: [dynamic-programming, grids]
source: original
license: proprietary
question: |
  A robot crosses a rectangular yard from the top-left cell to the bottom-right, moving
  only right or down. Each cell costs fuel to enter, including the starting cell.

  Find the cheapest total cost.

  **Input**
  The first line contains two integers `r` and `c`.
  Each of the next `r` lines contains `c` space-separated costs.

  **Output**
  A single integer: the minimum total cost.
constraints: |
  1 <= r, c <= 500
  0 <= each cost <= 1000

  Every path has the same length, so the greedy "always take the cheaper neighbour"
  approach is wrong — it can walk into an expensive region it cannot escape.
