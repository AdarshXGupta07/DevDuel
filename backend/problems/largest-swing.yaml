slug: largest-swing
title: Largest Swing
difficulty: medium
tags: [arrays, dynamic-programming, kadane]
source: original
license: proprietary
question: |
  A monitoring service records the hourly change in active users — positive when users
  joined, negative when they left. Find the largest total change over any single
  unbroken stretch of hours.

  The stretch must contain at least one hour, so even if every hour is negative the
  answer is the least bad single hour.

  **Input**
  The first line contains an integer `n`.
  The second line contains `n` space-separated integers, the hourly changes.

  **Output**
  A single integer: the largest total over any contiguous stretch.
constraints: |
  1 <= n <= 200000
  -100000 <= each change <= 100000
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n = int(data[0])
        changes = [int(x) for x in data[1:1 + n]]
