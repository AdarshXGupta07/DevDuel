slug: busiest-window
title: Busiest Window
difficulty: medium
tags: [sliding-window, arrays]
source: original
license: proprietary
question: |
  A server records how many requests it handled in each one-second bucket. Given the
  buckets and a window size `k`, find the largest number of requests handled in any
  window of `k` consecutive seconds.

  **Input**
  The first line contains two integers `n` and `k`.
  The second line contains `n` space-separated non-negative integers.

  **Output**
  A single integer: the maximum sum over any `k` consecutive buckets.
constraints: |
  1 <= k <= n <= 200000
  0 <= each bucket <= 10^6

  An O(n*k) solution will not finish in time on the largest cases.
