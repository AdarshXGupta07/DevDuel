test_cases:
  - public: true
    input: |
      6 2
      1 4 2 8 5 1
    output: |
      13
  - public: true
    input: |
      5 5
      1 1 1 1 1
    output: |
      5
  - input: |
      1 1
      0
    output: |
      0
  # Every window of 3 here contains at most one 5 — the 5s are spaced so they can
  # never share a window, which is the point of the case.
  - input: |
      8 3
      5 0 0 0 5 0 0 5
    output: |
      5
  - input: |
      10 1
      3 1 4 1 5 9 2 6 5 3
    output: |
      9
