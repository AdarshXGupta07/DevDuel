slug: deploy-order
title: Deploy Order
difficulty: medium
tags: [graphs, topological-sort]
source: original
license: proprietary
question: |
  A release pipeline has services that must be deployed in dependency order: if service A
  depends on service B, then B must be deployed first. Given the dependencies, produce a
  valid deploy order.

  When several services are ready at the same time, deploy the one with the smaller id
  first, so the answer is unique.

  **Input**
  The first line contains two integers `n` and `m` — the number of services (numbered
  `1..n`) and the number of dependency edges.
  Each of the next `m` lines contains two integers `a b`, meaning service `a` depends on
  service `b` (so `b` deploys before `a`).

  **Output**
  A single line of `n` space-separated service ids in a valid deploy order, or the word
  `CYCLE` if no valid order exists.
constraints: |
  1 <= n <= 100000
  0 <= m <= 200000
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n, m = int(data[0]), int(data[1])
        edges = []
        for i in range(m):
            a, b = int(data[2 + 2 * i]), int(data[3 + 2 * i])
            edges.append((a, b))
        # TODO: produce the deploy order, or print CYCLE
        print("CYCLE")

    main()
  javascript: |
    const data = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
    const n = data[0], m = data[1];
    const edges = [];
    for (let i = 0; i < m; i++) edges.push([data[2 + 2 * i], data[3 + 2 * i]]);
    // TODO: produce the deploy order, or print CYCLE
    console.log('CYCLE');
test_cases:
  - public: true
    input: |
      4 3
      2 1
      3 1
      4 3
    output: |
      1 2 3 4
  - public: true
    input: |
      2 2
      1 2
      2 1
    output: |
      CYCLE
  - input: |
      1 0
    output: |
      1
  - input: |
      5 0
    output: |
      1 2 3 4 5
  - input: |
      3 2
      3 2
      2 1
    output: |
      1 2 3
