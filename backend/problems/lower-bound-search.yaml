slug: lower-bound-search
title: First Shift At Or After
difficulty: easy
tags: [binary-search, arrays]
source: original
license: proprietary
question: |
  A rota lists shift start times in increasing order. For each of several queries, find
  the position of the first shift that starts at or after the queried time.

  Positions are 0-indexed. If every shift starts earlier than the queried time, report
  `n` — one past the end.

  **Input**
  The first line contains two integers `n` and `q`.
  The second line contains `n` space-separated integers in non-decreasing order.
  The third line contains `q` space-separated query times.

  **Output**
  A single line of `q` space-separated positions.
constraints: |
  1 <= n, q <= 200000
  -1000000000 <= each time and query <= 1000000000
  The shift times are given in non-decreasing order and may repeat.

  A linear scan per query is O(n*q) and will not finish on the largest inputs.
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n, q = int(data[0]), int(data[1])
        times = [int(x) for x in data[2:2 + n]]
        queries = [int(x) for x in data[2 + n:2 + n + q]]
        # TODO: first index whose value is >= the query
        print(" ".join(["0"] * q))

    main()
