slug: running-total
title: Running Total
difficulty: easy
tags: [arrays, prefix-sums]
source: original
license: proprietary
question: |
  A warehouse logs how many items arrived each hour. Given the hourly counts, report the
  running total after each hour.

  **Input**
  The first line contains an integer `n` — the number of hours.
  The second line contains `n` space-separated integers, the count for each hour.

  **Output**
  A single line of `n` space-separated integers, where the i-th value is the sum of the
  first i counts.
constraints: |
  1 <= n <= 100000
  -1000 <= each count <= 1000
