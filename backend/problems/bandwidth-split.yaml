slug: bandwidth-split
title: Bandwidth Split
difficulty: hard
tags: [binary-search, greedy, search-on-answer]
source: original
license: proprietary
question: |
  A batch of files must be copied by `k` workers. The files are queued in a fixed order
  and each worker takes a contiguous run of that queue — no reordering, no splitting a
  file. Every worker copies its run at the same speed, so the job finishes when the
  slowest worker does.

  Assign the runs so the largest total assigned to any single worker is as small as
  possible, and report that total.

  **Input**
  The first line contains two integers `n` and `k`.
  The second line contains `n` space-separated integers, the file sizes in queue order.

  **Output**
  A single integer: the smallest possible value of the largest worker's total.
constraints: |
  1 <= k <= n <= 200000
  1 <= each file size <= 1000000

  Trying every assignment is exponential. Think about what you can *check* quickly
  instead of what you can construct.
