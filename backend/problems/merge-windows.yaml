slug: merge-windows
title: Merge Maintenance Windows
difficulty: medium
tags: [sorting, intervals, greedy]
source: original
license: proprietary
question: |
  Several teams each book a maintenance window on the same cluster. Windows that overlap
  or touch must be merged into one, so operators see the true periods of downtime.

  Two windows touch when one ends exactly where the next begins — those merge too.

  **Input**
  The first line contains an integer `n`, the number of booked windows.
  Each of the next `n` lines contains two integers `start end` with start <= end.

  **Output**
  The merged windows in increasing order of start, one per line, as `start end`.
constraints: |
  1 <= n <= 200000
  0 <= start <= end <= 1000000000
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n = int(data[0])
        windows = []
        for i in range(n):
            windows.append((int(data[1 + 2 * i]), int(data[2 + 2 * i])))
        # TODO: merge overlapping or touching windows
        pass

    main()
