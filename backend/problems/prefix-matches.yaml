slug: prefix-matches
title: Autocomplete Count
difficulty: medium
tags: [tries, strings, hashing]
source: original
license: proprietary
question: |
  A search box suggests commands as you type. For each query prefix, report how many
  known commands start with it.

  A command counts as starting with a prefix equal to itself.

  **Input**
  The first line contains two integers `n` and `q`.
  Each of the next `n` lines contains one command (lowercase letters).
  Each of the next `q` lines contains one query prefix (lowercase letters).

  **Output**
  One integer per query, each on its own line.
constraints: |
  1 <= n, q <= 100000
  1 <= length of each command and prefix <= 20
  Commands may repeat, and each copy counts.
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n, q = int(data[0]), int(data[1])
        commands = data[2:2 + n]
        queries = data[2 + n:2 + n + q]
        # TODO: how many commands start with each prefix
        pass

    main()
