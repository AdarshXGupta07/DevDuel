slug: pair-sum-target
title: Pair Sum Target
difficulty: easy
tags: [arrays, hashing, two-pointers]
source: original
license: proprietary
question: |
  A payments team reconciles refunds by matching two transactions whose amounts add up
  to a disputed total. Given the transaction amounts and the disputed total, count how
  many distinct pairs of positions add up to exactly that total.

  A pair is two different positions i and j with i < j. Two pairs are different if their
  position sets differ, even when the amounts are the same.

  **Input**
  The first line contains an integer `n`.
  The second line contains `n` space-separated integers, the amounts.
  The third line contains an integer `target`.

  **Output**
  A single integer: the number of pairs.
constraints: |
  1 <= n <= 200000
  -1000000 <= each amount <= 1000000
  -2000000 <= target <= 2000000

  An O(n^2) scan of every pair will not finish on the largest inputs.
