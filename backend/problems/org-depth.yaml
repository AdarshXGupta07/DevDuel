slug: org-depth
title: Deepest Reporting Line
difficulty: medium
tags: [trees, dfs, graphs]
source: original
license: proprietary
question: |
  An organisation chart gives each employee their manager. Exactly one employee — the
  chief — has no manager, marked -1.

  Find the length of the longest reporting line: the number of people from the chief down
  to the most deeply nested employee, inclusive.

  **Input**
  The first line contains an integer `n`, the number of employees (0-indexed).
  The second line contains `n` space-separated manager indices, one per employee, with
  exactly one -1.

  **Output**
  A single integer: the number of people in the longest chain.
constraints: |
  1 <= n <= 200000
  The chart is a valid tree — no cycles, exactly one chief.

  A recursive depth-first walk will hit Python's recursion limit on a 200000-deep chain.
  Solve it without deep recursion.
