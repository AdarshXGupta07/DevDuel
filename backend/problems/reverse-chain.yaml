slug: reverse-chain
title: Reverse The Chain
difficulty: medium
tags: [linked-list, pointers]
source: original
license: proprietary
question: |
  A singly linked chain of nodes is stored as an array: node `i` holds a value, and
  `next[i]` is the index of the node that follows it, or -1 for the end.

  Walk the chain from the given head, reverse it, and print the values in the new order.

  **Input**
  The first line contains two integers `n` and `head`.
  The second line contains `n` space-separated values.
  The third line contains `n` space-separated next-indices, each either a valid index or -1.

  **Output**
  A single line with the values in reversed chain order, space-separated. If the chain is
  empty (head is -1), print nothing.
constraints: |
  1 <= n <= 200000
  -1 <= head < n
  -1000000000 <= each value <= 1000000000
  The chain contains no cycle, and not every node is necessarily part of it.
