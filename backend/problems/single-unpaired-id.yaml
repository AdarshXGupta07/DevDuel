slug: single-unpaired-id
title: The Unpaired Sensor
difficulty: easy
tags: [bit-manipulation, arrays, xor]
source: original
license: proprietary
question: |
  Every sensor in a mesh reports twice, except one faulty unit that reports only once.
  Given the stream of sensor ids, find the id that appears an odd number of times.

  Exactly one id appears once; every other id appears exactly twice.

  **Input**
  The first line contains an integer `n`.
  The second line contains `n` space-separated sensor ids.

  **Output**
  A single integer: the unpaired id.
constraints: |
  1 <= n <= 1000000, and n is odd
  0 <= each id <= 1000000000

  Solvable in O(n) time and O(1) extra space — a set or a counter works but is not the
  intended solution.
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n = int(data[0])
        ids = [int(x) for x in data[1:1 + n]]
