slug: booking-capacity
title: Most Bookings In One Room
difficulty: medium
tags: [greedy, sorting, intervals]
source: original
license: proprietary
question: |
  One meeting room, many requests. Each request has a start and an end time; two
  bookings may not overlap, though one may start exactly when another ends.

  Accept as many requests as possible and report how many that is.

  **Input**
  The first line contains an integer `n`.
  Each of the next `n` lines contains two integers `start end` with start <= end.

  **Output**
  A single integer: the largest number of non-overlapping bookings.
constraints: |
  1 <= n <= 200000
  0 <= start <= end <= 1000000000

  The obvious orderings — shortest first, earliest start first — both give wrong answers
  on some inputs. One ordering is provably optimal; find it.
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n = int(data[0])
        bookings = []
        for i in range(n):
            bookings.append((int(data[1 + 2 * i]), int(data[2 + 2 * i])))
        # TODO: maximum non-overlapping bookings
        print(0)

    main()
