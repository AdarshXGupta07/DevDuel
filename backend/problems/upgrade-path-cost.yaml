slug: upgrade-path-cost
title: Upgrade Path Cost
difficulty: medium
tags: [dynamic-programming, arrays]
source: original
license: proprietary
question: |
  A service must be upgraded through a series of versions. Applying version `i` costs
  `cost[i]`. From a version you may jump to the next one, or skip exactly one — you can
  never skip two in a row.

  You may start at version 0 or version 1, and you are finished once you have moved past
  the last version. Find the cheapest total.

  **Input**
  The first line contains an integer `n`, the number of versions.
  The second line contains `n` space-separated integers, the costs.

  **Output**
  A single integer: the minimum total cost.
constraints: |
  1 <= n <= 200000
  0 <= each cost <= 1000000
starter_code:
  python: |
    import sys

    def main():
        data = sys.stdin.read().split()
        n = int(data[0])
        cost = [int(x) for x in data[1:1 + n]]
