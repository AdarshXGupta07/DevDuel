slug: longest-unique-run
title: Longest Unique Session
difficulty: medium
tags: [sliding-window, strings, hashing]
source: original
license: proprietary
question: |
  A session log records one page code per visit, as a string of lowercase letters. Find
  the length of the longest unbroken stretch in which no page is visited twice.

  **Input**
  A single line containing the log. It may be empty.

  **Output**
  A single integer: the length of the longest stretch with no repeated character.
constraints: |
  0 <= length of the log <= 200000
  The log contains only lowercase letters.
