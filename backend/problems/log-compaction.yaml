slug: log-compaction
title: Log Compaction
difficulty: easy
tags: [strings, hashing, sorting]
source: original
license: proprietary
question: |
  A log file contains one event name per line. Compact it: report each distinct event and
  how many times it occurred, ordered by count descending. Ties are broken by event name
  in ascending lexicographic order.

  **Input**
  The first line contains an integer `n` — the number of log lines.
  Each of the next `n` lines contains one event name (lowercase letters only).

  **Output**
  One line per distinct event, formatted as `name count`.
constraints: |
  1 <= n <= 200000
  Each event name is between 1 and 20 characters.
