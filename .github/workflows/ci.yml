name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: backend
        # Database and sandbox tests skip themselves when their dependency is absent;
        # the sandbox suite runs in its own job below, where Docker is available.
        env:
          SUPABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          APP_ENV: development
          JWT_SECRET: ci_only_secret
        run: pytest -q --ignore=tests/test_sandbox.py

      - name: Problem files are valid
        working-directory: backend
        env:
          SUPABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          APP_ENV: development
          JWT_SECRET: ci_only_secret
        run: python -m scripts.seed_problems --check

      - name: Migrations have a single head
        working-directory: backend
        env:
          SUPABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          APP_ENV: development
          JWT_SECRET: ci_only_secret
        # Catches the classic mistake of two branches each adding a migration on the
        # same parent — which only shows up as a failed deploy otherwise.
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          echo "heads: $heads"
          test "$heads" -eq 1

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Build runner images
        working-directory: backend
        run: |
          docker build -f docker/runner/Dockerfile.python -t devduel-runner:py312 docker/runner
          docker build -f docker/runner/Dockerfile.node   -t devduel-runner:node22 docker/runner
          docker build -f docker/runner/Dockerfile.cpp    -t devduel-runner:cpp13 docker/runner
          docker build -f docker/runner/Dockerfile.java   -t devduel-runner:java21 docker/runner

      - name: Attack suite
        working-directory: backend
        env:
          SUPABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          APP_ENV: development
          JWT_SECRET: ci_only_secret
          # Without this a broken Docker setup would SKIP all 19 tests and report a
          # green tick — a security suite that silently does not run is worse than one
          # that fails.
          DEVDUEL_REQUIRE_DOCKER: "1"
        run: pytest tests/test_sandbox.py -v

      - name: Verify every problem is solvable
        working-directory: backend
        env:
          SUPABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          APP_ENV: development
          JWT_SECRET: ci_only_secret
        run: python -m scripts.verify_problems

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
